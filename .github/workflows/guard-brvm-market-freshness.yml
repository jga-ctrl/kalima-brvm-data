name: Guard BRVM market freshness

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/guard-brvm-market-freshness.yml"
      - ".github/workflows/update-brvm-market.yml"
      - "scripts/update-brvm-market.mjs"

permissions:
  contents: write

concurrency:
  group: brvm-market-feed
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check feed freshness
        id: freshness
        shell: bash
        run: |
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            let stale = true;
            let ageMinutes = Number.POSITIVE_INFINITY;
            try {
              const feed = JSON.parse(await readFile("latest.json", "utf8"));
              const fetchedAt = Date.parse(feed.fetchedAt);
              if (Number.isFinite(fetchedAt)) {
                ageMinutes = (Date.now() - fetchedAt) / 60000;
                stale = ageMinutes > 75;
              }
            } catch {}
            console.log(`Flux BRVM : age=${Number.isFinite(ageMinutes) ? ageMinutes.toFixed(1) : "inconnu"} min, relance=${stale}`);
            process.stdout.write(`stale=${stale}\n`);
          ' >> "$GITHUB_OUTPUT"

      - name: Validate feed updater on pull requests
        if: github.event_name == 'pull_request'
        run: node scripts/update-brvm-market.mjs

      - name: Repair stale feed
        if: github.event_name != 'pull_request' && steps.freshness.outputs.stale == 'true'
        run: node scripts/update-brvm-market.mjs

      - name: Publish repaired feed
        if: github.event_name != 'pull_request' && steps.freshness.outputs.stale == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          if git diff --cached --quiet; then
            echo "Le flux est déjà à jour."
            exit 0
          fi
          git commit -m "Repair stale BRVM market feed"
          git push
