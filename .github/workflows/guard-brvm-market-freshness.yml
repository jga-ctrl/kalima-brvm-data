name: Guard BRVM market freshness

on:
  schedule:
    # Contrôles utiles seulement autour/après la clôture BRVM les jours ouvrés.
    - cron: "47 15,17,19,21 * * 1-5"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/guard-brvm-market-freshness.yml"
      - ".github/workflows/update-brvm-market.yml"
      - "scripts/update-brvm-market.mjs"
      - "scripts/market-calendar.mjs"

permissions:
  contents: write

concurrency:
  group: brvm-market-feed
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check certified session freshness
        id: freshness
        shell: bash
        run: |
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            import { feedNeedsRefresh } from "./scripts/market-calendar.mjs";
            let feed = null;
            try { feed = JSON.parse(await readFile("latest.json", "utf8")); } catch {}
            const result = feedNeedsRefresh(feed);
            console.log(`Flux BRVM : refresh=${result.refresh} — ${result.reason}`);
            process.stdout.write(`stale=${result.refresh}\n`);
          ' >> "$GITHUB_OUTPUT"

      - name: Validate feed updater on pull requests
        if: github.event_name == 'pull_request'
        run: node scripts/update-brvm-market.mjs

      - name: Repair stale feed
        if: github.event_name != 'pull_request' && steps.freshness.outputs.stale == 'true'
        run: node scripts/update-brvm-market.mjs

      - name: Publish repaired feed
        if: success() && github.event_name != 'pull_request' && steps.freshness.outputs.stale == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          if git diff --cached --quiet; then
            echo "Aucune nouvelle séance certifiée à publier."
            exit 0
          fi
          git commit -m "Repair stale BRVM market feed"
          git push
