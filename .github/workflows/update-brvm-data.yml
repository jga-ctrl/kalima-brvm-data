name: Update BRVM market data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9-15 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-brvm-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and validate 47 BRVM quotes
        run: node scripts/update-brvm-market.mjs
      - name: Commit latest feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git diff --cached --quiet || git commit -m "Update BRVM market data"
          git push
