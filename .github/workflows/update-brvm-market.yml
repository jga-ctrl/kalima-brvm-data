name: Update BRVM market data

on:
  schedule:
    # BRVM trading days only. Multiple post-market checks allow for delayed publication.
    - cron: "17 15,17,19,21 * * 1-5"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-brvm-market.yml"
      - "scripts/update-brvm-market.mjs"
      - "scripts/require-official-boc.mjs"
      - "scripts/verify-market-pipeline.mjs"
  pull_request:
    paths:
      - ".github/workflows/update-brvm-market.yml"
      - "scripts/update-brvm-market.mjs"
      - "scripts/require-official-boc.mjs"
      - "scripts/verify-market-pipeline.mjs"

permissions:
  contents: write

concurrency:
  group: brvm-market-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require official BRVM BOC for the same closed session
        id: boc
        run: node scripts/require-official-boc.mjs

      - name: Fetch and validate 47 BRVM quotes
        if: steps.boc.outputs.ready == 'true'
        run: node scripts/update-brvm-market.mjs

      - name: Verify BRVM pipeline locks and feed integrity
        if: github.event_name == 'pull_request' || steps.boc.outputs.ready == 'true'
        run: node scripts/verify-market-pipeline.mjs

      - name: Waiting for official BOC
        if: steps.boc.outputs.ready != 'true'
        run: echo "BOC officiel pas encore disponible. Run terminé proprement; nouvelle tentative au prochain créneau."

      - name: Publish latest validated feed
        if: success() && github.event_name != 'pull_request' && steps.boc.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          if git diff --cached --quiet; then
            echo "Aucune nouvelle séance ou correction BRVM."
            exit 0
          fi
          git commit -m "Update validated BRVM market feed"
          git push
