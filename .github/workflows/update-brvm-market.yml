name: Update BRVM market data

on:
  schedule:
    # BRVM trading days only. Multiple post-market checks allow for delayed publication
    # without generating hourly no-op commits overnight or during weekends.
    - cron: "17 15,17,19,21 * * 1-5"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-brvm-market.yml"
      - "scripts/update-brvm-market.mjs"
  pull_request:
    paths:
      - ".github/workflows/update-brvm-market.yml"
      - "scripts/update-brvm-market.mjs"

permissions:
  contents: write

concurrency:
  group: brvm-market-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch and validate 47 BRVM quotes
        run: node scripts/update-brvm-market.mjs

      - name: Publish latest validated feed
        if: success() && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          if git diff --cached --quiet; then
            echo "Aucune nouvelle séance ou correction BRVM."
            exit 0
          fi
          git commit -m "Update validated BRVM market feed"
          git push
