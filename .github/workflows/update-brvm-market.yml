name: Update BRVM market data

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-brvm-market.yml"
      - "scripts/update-brvm-market.mjs"
  pull_request:
    paths:
      - ".github/workflows/update-brvm-market.yml"
      - "scripts/update-brvm-market.mjs"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: brvm-market-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch and validate 47 BRVM quotes
        run: node scripts/update-brvm-market.mjs

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload market feed
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/brvm-market

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish market feed
        id: deployment
        uses: actions/deploy-pages@v4
